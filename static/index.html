<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Herdr Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- Apple iOS Web App / PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Herdr">
  <meta name="theme-color" content="#12151d">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Agent switcher: the only thing in the top bar -->
    <header class="app-header">
      <button id="agent-select" class="agent-select" aria-haspopup="dialog" aria-label="Choose project">
        <span id="agent-select-dot" class="agent-dot unknown"></span>
        <span id="agent-select-name" class="agent-select-name">Loading…</span>
        <svg class="agent-select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <button id="btn-settings" class="icon-btn header-gear" aria-label="Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span id="conn-indicator" class="conn-dot connected" title="Connection status"></span>
      </button>
    </header>

    <!-- Scrollable Transcript -->
    <main id="history-container" class="history-container">
      <div id="history-content" class="history-content">
        <div class="history-empty">No active agent selected.</div>
      </div>
      <button id="btn-scroll-bottom" class="btn-scroll-bottom hidden" aria-label="Jump to bottom">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
      </button>
    </main>

    <!-- Bottom Input Dock -->
    <footer class="input-dock">
      <form id="prompt-form" class="prompt-form">
        <button type="button" id="btn-esc" class="dock-key" title="Send Escape">esc</button>
        <button type="button" id="btn-ctrl-c" class="dock-key danger-key" title="Send Interrupt (Ctrl+C)">^C</button>
        <textarea
          id="prompt-input"
          class="prompt-input"
          rows="1"
          placeholder="Prompt or tap mic…"
          enterkeyhint="send"
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
        ></textarea>
        <button type="submit" id="btn-send" class="btn-send" aria-label="Send prompt" disabled>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- Full-screen project picker -->
  <section id="agent-picker" class="agent-picker hidden" role="dialog" aria-label="Projects">
    <header class="picker-head">
      <span class="picker-title">Projects</span>
      <button id="btn-close-picker" class="icon-btn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>
    <div id="agent-list" class="agent-list"></div>
  </section>

  <!-- Settings sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <section id="settings-sheet" class="settings-sheet hidden" aria-label="Settings">
    <div class="sheet-grip"></div>

    <div class="sheet-row sheet-agent">
      <div class="sheet-agent-text">
        <span id="agent-title-text" class="sheet-title">No agent selected</span>
        <span id="agent-cwd-text" class="sheet-cwd"></span>
      </div>
      <span id="agent-status-badge" class="status-badge status-unknown">--</span>
    </div>

    <div class="sheet-row">
      <label for="lines-select">Scrollback</label>
      <select id="lines-select">
        <option value="50">50 lines</option>
        <option value="100" selected>100 lines</option>
        <option value="200">200 lines</option>
        <option value="400">400 lines</option>
      </select>
    </div>

    <div class="sheet-row">
      <label for="toggle-statusbar">Show agent status bar</label>
      <input type="checkbox" id="toggle-statusbar">
    </div>

    <div class="sheet-actions">
      <button id="btn-refresh" class="sheet-btn">Refresh</button>
      <button id="btn-copy" class="sheet-btn">Copy transcript</button>
    </div>

    <button id="btn-close-sheet" class="sheet-btn sheet-close">Done</button>
  </section>

  <script src="/app.js"></script>
</body>
</html>
